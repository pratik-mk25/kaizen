{% extends "base.html" %}

{% block title %}Log Flight - KAIZEN{% endblock %}
{% block header_title %}Log Flight{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-headline font-bold uppercase tracking-tight">Record Telemetry Log</h2>
        <a href="/flights" class="text-xs text-on-surface-variant hover:text-white uppercase tracking-widest flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back
        </a>
    </div>

    <form action="/flights/new" method="post" class="bg-surface border border-outline-variant rounded-xl p-6 space-y-5 shadow-2xl">
        <div class="space-y-1">
            <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Pilot</label>
            <select name="pilot_id" required class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none">
                {% for m in members %}
                <option value="{{ m.id }}" {% if m.id == user.id %}selected{% endif %}>{{ m.display_name or m.username }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Drone Equipment</label>
                <select name="equipment_id" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none">
                    <option value="">None / Custom Craft</option>
                    {% for eq in equipment %}
                    <option value="{{ eq.id }}">{{ eq.name }} ({{ eq.equipment_type }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">LiPo Battery Pack</label>
                <select name="battery_id" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none">
                    <option value="">None / N/A</option>
                    {% for b in batteries %}
                    <option value="{{ b.id }}">{{ b.name }} ({{ b.cell_count }} - {{ b.capacity_mah }}mAh)</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Flight Date</label>
                <input type="date" name="flight_date" required value="{{ today_str if today_str else '' }}" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none" />
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Duration (Minutes)</label>
                <input type="number" name="duration_minutes" required min="1" value="15" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none" />
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Location</label>
                <input type="text" name="location" placeholder="e.g. Club Field, Indoor Arena" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none" />
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Purpose</label>
                <input type="text" name="purpose" placeholder="e.g. PID Tuning, Mapping Mission" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none" />
            </div>
        </div>

        <div class="space-y-1">
            <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest block">Telemetry & Flight Notes</label>
            <textarea name="notes" rows="3" placeholder="Flight stability, battery end voltage, crash report, or performance notes..." class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2 text-sm text-on-surface focus:ring-1 focus:ring-primary outline-none"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-3">
            <a href="/flights" class="px-4 py-2 border border-outline-variant/40 text-on-surface-variant text-xs font-bold uppercase tracking-widest rounded-lg hover:bg-surface-variant/30">Cancel</a>
            <button type="submit" class="px-6 py-2 bg-primary text-on-primary text-xs font-bold uppercase tracking-widest rounded-lg hover:brightness-110 shadow-[0_0_15px_rgba(139,92,246,0.4)]">Submit Log</button>
        </div>
    </form>
</div>
{% endblock %}
